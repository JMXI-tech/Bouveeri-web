services:
  db:
    image: postgres:16-alpine
    restart: always
    environment: {POSTGRES_USER: boveeri, POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: boveeri}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U boveeri"], interval: 5s, retries: 10}
  app:
    build: .
    restart: always
    env_file: .env
    environment: {DATABASE_URL: "postgres://boveeri:${DB_PASSWORD}@db:5432/boveeri", UPLOAD_DIR: /data/uploads}
    volumes: [uploads:/data/uploads]
    depends_on: {db: {condition: service_healthy}}
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80","443:443"]
    environment: {DOMAIN: "${DOMAIN}"}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile, caddydata:/data]
    depends_on: [app]
volumes: {dbdata: {}, caddydata: {}, uploads: {}}
